name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # ubuntu-latest runners ship with the Android SDK pre-installed
      # (ANDROID_HOME already set), so no separate SDK install step is needed.

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Initialize Capacitor project
        run: npx cap init "Roz Ka Gyan" com.rozkagyan.quiz --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        id: gradle_build
        working-directory: android
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Surface build failure details
        if: steps.gradle_build.outcome == 'failure'
        run: |
          python3 - <<'EOF'
          data = open('/tmp/gradle.log', 'r', errors='replace').read()
          marker = 'FAILURE: Build failed'
          idx = data.find(marker)
          snippet = data[idx:idx + 3800] if idx != -1 else data[-3800:]
          esc = snippet.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::error::{esc}")
          EOF

      - name: Upload APK
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: roz-ka-gyan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Fail job if build failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1
